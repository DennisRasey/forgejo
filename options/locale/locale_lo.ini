reinstall_confirm_message = ການຕິດຕັ້ງໃໝ່ໃສ່ຖານຂໍ້ມູນ Forgejo ທີ່ມີຢູ່ແລ້ວອາດເຮັດໃຫ້ເກີດຫຼາຍບັນຫາ. ໃນກໍລະນີສ່ວນໃຫຍ່, ທ່ານຄວນໃຊ້ໄຟລ໌ "app.ini" ທີ່ມີຢູ່ແລ້ວເພື່ອຣັນ Forgejo. ຖ້າທ່ານໝັ້ນໃຈໃນສິ່ງທີ່ກຳລັງເຮັດ, ກະລຸນາຢືນຢັນດັ່ງນີ້:
reinstall_confirm_check_1 = ຂໍ້ມູນທີ່ເຂົ້າລະຫັດດ້ວຍ SECRET_KEY ໃນ app.ini ອາດຈະເສຍຫາຍ: ຜູ້ໃຊ້ອາດຈະເຂົ້າລະບົບດ້ວຍ 2FA/OTP ບໍ່ໄດ້ ແລະ ລະບົບສຳເນົາກະຈົກອາດຈະເຮັດວຽກບໍ່ຖືກຕ້ອງ. ການໝາຍຫ້ອງນີ້ແມ່ນການຢືນຢັນວ່າໄຟລ໌ app.ini ປະຈຸບັນມີ SECRET_KEY ທີ່ຖືກຕ້ອງ.
reinstall_confirm_check_2 = ຄັງເກັບລະຫັດ ແລະ ການຕັ້ງຄ່າອາດຈະຕ້ອງໄດ້ຊິງຄ໌ຂໍ້ມູນໃໝ່. ການໝາຍຫ້ອງນີ້ແມ່ນການຢືນຢັນວ່າທ່ານຈະຊິງຄ໌ hooks ແລະ ໄຟລ໌ authorized_keys ດ້ວຍຕົນເອງ. ທ່ານຢືນຢັນວ່າຈະກວດສອບຄວາມຖືກຕ້ອງຂອງຄັງເກັບລະຫັດ ແລະ ການຕັ້ງຄ່າສຳເນົາກະຈົກ.
reinstall_confirm_check_3 = ທ່ານຢືນຢັນວ່າທ່ານໝັ້ນໃຈຢ່າງແນ່ນອນວ່າ Forgejo ນີ້ກຳລັງຣັນດ້ວຍທີ່ຕັ້ງ app.ini ທີ່ຖືກຕ້ອງ ແລະ ທ່ານໝັ້ນໃຈວ່າຕ້ອງຕິດຕັ້ງໃໝ່. ທ່ານຢືນຢັນວ່າທ່ານຮັບຮູ້ຄວາມສ່ຽງຂ້າງເທິງ.
