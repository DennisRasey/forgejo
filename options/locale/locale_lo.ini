code.read = <b>ອ່ານ:</b> ເຂົ້າເຖິງ ແລະ ຄລອນ (Clone) ລະຫັດຈາກຄັງນີ້.
code.write = <b>ຂຽນ:</b> ພຸດ (Push) ລົງຄັງ, ສ້າງສາຂາ ແລະ ແທັກ.
issues.read = <b>ອ່ານ:</b> ອ່ານ ແລະ ສ້າງບັນຫາ (Issues) ລວມທັງຄຳເຫັນ.
issues.write = <b>ຂຽນ:</b> ປິດບັນຫາ ແລະ ຈັດການຂໍ້ມູນຕ່າງໆ ເຊັ່ນ: ປ້າຍກຳກັບ, ຈຸດໝາຍ, ຜູ້ຮັບຜິດຊອບ, ກຳນົດສົ່ງ ແລະ ສິ່ງທີ່ກ່ຽວຂ້ອງ.
pulls.read = <b>ອ່ານ:</b> ອ່ານ ແລະ ສ້າງຄຳຮ້ອງຂໍດຶງຂໍ້ມູນ (Pull requests).
