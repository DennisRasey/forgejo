settings.trust_model.committer.desc = ລາຍເຊັນທີ່ຖືກຕ້ອງຈະຖືກໝາຍວ່າ "ເຊື່ອຖືໄດ້" ກໍຕໍ່ເມື່ອພວກເຂົາກົງກັບຜູ້ຄອມມິດເທົ່ານັ້ນ, ຖ້າບໍ່ດັ່ງນັ້ນຈະຖືກໝາຍວ່າ "ບໍ່ກົງກັນ". ສິ່ງນີ້ບັງຄັບໃຫ້ Forgejo ເປັນຜູ້ຄອມມິດໃນຄອມມິດທີ່ມີການເຊັນ ໂດຍທີ່ຜູ້ຄອມມິດແທ້ຈິງຈະຖືກໝາຍເປັນ Co-authored-by: ແລະ Co-committed-by: ໃນຄອມມິດ. ຄີ Forgejo ເລີ່ມຕົ້ນຕ້ອງກົງກັບຜູ້ໃຊ້ໃນຖານຂໍ້ມູນ.
settings.trust_model.collaboratorcommitter = ຜູ້ຮ່ວມງານ+ຜູ້ຄອມມິດ
settings.trust_model.collaboratorcommitter.long = ຜູ້ຮ່ວມງານ+ຜູ້ຄອມມິດ: ເຊື່ອຖືລາຍເຊັນໂດຍຜູ້ຮ່ວມງານທີ່ກົງກັບຜູ້ຄອມມິດ
settings.trust_model.collaboratorcommitter.desc = ລາຍເຊັນທີ່ຖືກຕ້ອງໂດຍຜູ້ຮ່ວມງານຂອງຄັງເກັບນີ້ຈະຖືກໝາຍວ່າ "ເຊື່ອຖືໄດ້" ຫາກພວກເຂົາກົງກັບຜູ້ຄອມມິດ. ຖ້າບໍ່ດັ່ງນັ້ນ, ລາຍເຊັນທີ່ຖືກຕ້ອງຈະຖືກໝາຍວ່າ "ບໍ່ໜ້າເຊື່ອຖື" ຫາກລາຍເຊັນກົງກັບຜູ້ຄອມມິດ ແລະ "ບໍ່ກົງກັນ" ໃນກໍລະນີອື່ນໆ. ສິ່ງນີ້ຈະບັງຄັບໃຫ້ Forgejo ຖືກໝາຍເປັນຜູ້ຄອມມິດໃນຄອມມິດທີ່ມີການເຊັນ ໂດຍທີ່ຜູ້ຄອມມິດແທ້ຈິງຈະຖືກໝາຍເປັນ Co-Authored-By: ແລະ Co-Committed-By: ໃນຄອມມິດ. ຄີ Forgejo ເລີ່ມຕົ້ນຕ້ອງກົງກັບຜູ້ໃຊ້ໃນຖານຂໍ້ມູນ.
