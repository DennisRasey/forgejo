[startpage]
app_desc = ບໍລິການ Git ແບບຕິດຕັ້ງເອງທີ່ໃຊ້ງານງ່າຍ
install = ຕິດຕັ້ງງ່າຍ
install_desc = ພຽງແຕ່ <a target="_blank" rel="noopener noreferrer" href="%[1]s">ຣັນໄຟລ໌ binary</a> ສຳລັບແພລດຟອມຂອງທ່ານ, ໃຊ້ຜ່ານ <a target="_blank" rel="noopener noreferrer" href="%[2]s">Docker</a>, ຫຼື ຕິດຕັ້ງຜ່ານ <a target="_blank" rel="noopener noreferrer" href="%[3]s">ແພັກເກັດ</a>.
platform = ຮອງຮັບຫຼາຍແພລດຟອມ
platform_desc = Forgejo ສາມາດເຮັດວຽກໄດ້ໃນລະບົບປະຕິບັດການເສລີເຊັ່ນ Linux ແລະ FreeBSD, ລວມທັງສະຖາປັດຕະຍະກຳ CPU ທີ່ຫຼາກຫຼາຍ. ເລືອກແບບທີ່ທ່ານມັກໄດ້ເລີຍ!
lightweight = ເບົາບາງ
lightweight_desc = Forgejo ຕ້ອງການຊັບພະຍາກອນໜ້ອຍ ແລະ ສາມາດຣັນໃນ Raspberry Pi ລາຄາຖືກໄດ້. ຊ່ວຍປະຢັດພະລັງງານເຄື່ອງຂອງທ່ານ!
license = ໂອເພນຊອດ
license_desc = ມາໃຊ້ <a target="_blank" rel="noopener noreferrer" href="%[1]s">Forgejo</a>! ຮ່ວມກັບພວກເຮົາໂດຍການ <a target="_blank" rel="noopener noreferrer" href="%[2]s">ປະກອບສ່ວນ</a> ເພື່ອເຮັດໃຫ້ໂຄງການນີ້ດີຂຶ້ນກວ່າເກົ່າ. ຢ່າອາຍທີ່ຈະມາເປັນຜູ້ຮ່ວມພັດທະນາ!

