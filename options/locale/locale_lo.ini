account_security_caution.text_1 = ຖ້າແມ່ນທ່ານເອງ, ທ່ານສາມາດເມີນເສີຍຕໍ່ອີເມລນີ້ໄດ້ຢ່າງປອດໄພ.
account_security_caution.text_2 = ຖ້າບໍ່ແມ່ນທ່ານ, ບັນຊີຂອງທ່ານອາດຈະຖືກແຮັກ. ກະລຸນາຕິດຕໍ່ຜູ້ບໍລິຫານເວັບໄຊນີ້.
totp_enrolled.subject = ທ່ານໄດ້ເປີດໃຊ້ TOTP ເປັນວິທີການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນ
totp_enrolled.text_1.no_webauthn = ທ່ານຫາກໍ່ເປີດໃຊ້ TOTP ສຳລັບບັນຊີຂອງທ່ານ. ນີ້ໝາຍຄວາມວ່າໃນການເຂົ້າສູ່ລະບົບຄັ້ງຕໍ່ໄປ, ທ່ານຕ້ອງໃຊ້ TOTP ເປັນວິທີການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນ.
totp_enrolled.text_1.has_webauthn = ທ່ານຫາກໍ່ເປີດໃຊ້ TOTP ສຳລັບບັນຊີຂອງທ່ານ. ນີ້ໝາຍຄວາມວ່າໃນການເຂົ້າສູ່ລະບົບຄັ້ງຕໍ່ໄປ, ທ່ານສາມາດໃຊ້ TOTP ຫຼື ຄີຄວາມປອດໄພຂອງທ່ານເປັນວິທີການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນ.
