oauth2_application_create_description = ແອັບພລິເຄຊັນ OAuth2 ຊ່ວຍໃຫ້ແອັບພລິເຄຊັນຈາກພາຍນອກສາມາດເຂົ້າເຖິງບັນຊີຜູ້ໃຊ້ໃນລະບົບນີ້ໄດ້.
oauth2_application_remove_description = ການລຶບແອັບພລິເຄຊັນ OAuth2 ຈະເຮັດໃຫ້ມັນບໍ່ສາມາດເຂົ້າເຖິງບັນຊີຜູ້ໃຊ້ທີ່ເຄີຍໄດ້ຮັບອະນຸຍາດໄດ້. ຕ້ອງການດຳເນີນການຕໍ່ຫຼືບໍ່?
oauth2_application_locked = Forgejo ມີການລົງທະບຽນແອັບ OAuth2 ບາງຕົວໄວ້ລ່ວງໜ້າ. ເພື່ອປ້ອງກັນຂໍ້ຜິດພາດ, ແອັບເຫຼົ່ານີ້ບໍ່ສາມາດແກ້ໄຂ ຫຼື ລຶບອອກໄດ້. ກະລຸນາອ່ານເອກະສານ OAuth2 ສຳລັບຂໍ້ມູນເພີ່ມເຕີມ.
authorized_oauth2_applications = ແອັບພລິເຄຊັນ OAuth2 ທີ່ໄດ້ຮັບອະນຸຍາດ
authorized_oauth2_applications_description = ທ່ານໄດ້ໃຫ້ສິດເຂົ້າເຖິງບັນຊີ Forgejo ສ່ວນຕົວຂອງທ່ານແກ່ແອັບພລິເຄຊັນເຫຼົ່ານີ້. ກະລຸນາຍົກເລີກສິດສຳລັບແອັບທີ່ທ່ານບໍ່ໄດ້ໃຊ້ແລ້ວ.
revoke_key = ຍົກເລີກສິດ
revoke_oauth2_grant = ຍົກເລີກການເຂົ້າເຖິງ
revoke_oauth2_grant_description = ການຍົກເລີກສິດຈະເຮັດໃຫ້ແອັບພລິເຄຊັນນີ້ບໍ່ສາມາດເຂົ້າເຖິງຂໍ້ມູນຂອງທ່ານໄດ້ອີກ. ທ່ານແນ່ໃຈຫຼືບໍ່?
revoke_oauth2_grant_success = ຍົກເລີກສິດການເຂົ້າເຖິງສຳເລັດແລ້ວ.
twofa_desc = ເພື່ອປົກປ້ອງບັນຊີຂອງທ່ານຈາກການຖືກລັກລະຫັດຜ່ານ, ທ່ານສາມາດໃຊ້ສະມາດໂຟນ ຫຼື ອຸປະກອນອື່ນເພື່ອຮັບລະຫັດຜ່ານແບບໃຊ້ຄັ້ງດຽວ (TOTP).
twofa_recovery_tip = ຖ້າທ່ານເຮັດອຸປະກອນເສຍ, ທ່ານສາມາດໃຊ້ລະຫັດກູ້ຄືນແບບໃຊ້ຄັ້ງດຽວເພື່ອເຂົ້າສູ່ລະບົບບັນຊີຂອງທ່ານຄືນໃໝ່ໄດ້.
twofa_is_enrolled = ປັດຈຸບັນບັນຊີຂອງທ່ານ <strong>ໄດ້ເປີດໃຊ້</strong> ການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນແລ້ວ.
twofa_not_enrolled = ປັດຈຸບັນບັນຊີຂອງທ່ານຍັງບໍ່ໄດ້ເປີດໃຊ້ການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນ.
twofa_disable = ປິດການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນ
twofa_scratch_token_regenerate = ສ້າງລະຫັດກູ້ຄືນແບບໃຊ້ຄັ້ງດຽວໃໝ່
twofa_scratch_token_regenerated = ລະຫັດກູ້ຄືນໃໝ່ຂອງທ່ານແມ່ນ %s. ກະລຸນາເກັບໄວ້ໃນບ່ອນທີ່ປອດໄພ ເພາະມັນຈະບໍ່ສະແດງໃຫ້ເຫັນອີກ.
twofa_enroll = ເປີດໃຊ້ການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນ
twofa_disable_note = ທ່ານສາມາດປິດການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນໄດ້ຖ້າຈຳເປັນ.
twofa_disable_desc = ການປິດການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນຈະເຮັດໃຫ້ບັນຊີຂອງທ່ານມີຄວາມປອດໄພໜ້ອຍລົງ. ຕ້ອງການດຳເນີນການຕໍ່ຫຼືບໍ່?
regenerate_scratch_token_desc = ຖ້າທ່ານເຮັດລະຫັດກູ້ຄືນເສຍ ຫຼື ໃຊ້ມັນໄປແລ້ວ, ທ່ານສາມາດຕັ້ງຄ່າໃໝ່ໄດ້ທີ່ນີ້.
twofa_disabled = ປິດການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນແລ້ວ.
scan_this_image = ສະແກນຮູບນີ້ດ້ວຍແອັບຢືນຢັນຕົວຕົນຂອງທ່ານ:
or_enter_secret = ຫຼື ປ້ອນລະຫັດລັບ: %s
then_enter_passcode = ແລ້ວປ້ອນລະຫັດທີ່ສະແດງໃນແອັບພລິເຄຊັນ:
passcode_invalid = ລະຫັດບໍ່ຖືກຕ້ອງ. ກະລຸນາລອງໃໝ່.
twofa_enrolled = ເປີດໃຊ້ການຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນສຳເລັດແລ້ວ. ກະລຸນາເກັບລະຫັດກູ້ຄືນ (%s) ໄວ້ໃນບ່ອນທີ່ປອດໄພ ເພາະມັນຈະບໍ່ສະແດງໃຫ້ເຫັນອີກ.
twofa_failed_get_secret = ບໍ່ສາມາດຮັບລະຫັດລັບໄດ້.
webauthn_desc = Security keys ແມ່ນອຸປະກອນຮາດແວທີ່ເກັບມ້ຽນກະແຈເຂົ້າລະຫັດ. ສາມາດໃຊ້ເພື່ອຢືນຢັນຕົວຕົນສອງຂັ້ນຕອນໄດ້. ອຸປະກອນຕ້ອງຮອງຮັບມາດຕະຖານ <a rel="noreferrer" target="_blank" href="%s">WebAuthn Authenticator</a>.
webauthn_register_key = ເພີ່ມ security key
webauthn_nickname = ຊື່ຫຼິ້ນ
webauthn_delete_key = ລຶບ security key
webauthn_delete_key_desc = ຖ້າທ່ານລຶບ security key ອອກ ທ່ານຈະບໍ່ສາມາດໃຊ້ມັນເຂົ້າສູ່ລະບົບໄດ້ອີກ. ຕ້ອງການດຳເນີນການຕໍ່ຫຼືບໍ່?
webauthn_key_loss_warning = ຖ້າທ່ານເຮັດ security keys ເສຍ, ທ່ານຈະສູນເສຍສິດການເຂົ້າເຖິງບັນຊີຂອງທ່ານ.
webauthn_alternative_tip = ທ່ານອາດຈະຕ້ອງການຕັ້ງຄ່າວິທີການຢືນຢັນຕົວຕົນສຳຮອງອື່ນໆ.
manage_account_links = ບັນຊີທີ່ເຊື່ອມຕໍ່
manage_account_links_desc = ບັນຊີພາຍນອກເຫຼົ່ານີ້ໄດ້ຖືກເຊື່ອມຕໍ່ກັບບັນຊີ Forgejo ຂອງທ່ານ.
link_account = ເຊື່ອມຕໍ່ບັນຊີ
remove_account_link = ລຶບການເຊື່ອມຕໍ່ບັນຊີ
remove_account_link_desc = ການລຶບການເຊື່ອມຕໍ່ຈະເຮັດໃຫ້ບັນຊີນັ້ນບໍ່ສາມາດເຂົ້າເຖິງບັນຊີ Forgejo ຂອງທ່ານໄດ້. ຕ້ອງການດຳເນີນການຕໍ່ຫຼືບໍ່?
remove_account_link_success = ລຶບການເຊື່ອມຕໍ່ບັນຊີສຳເລັດແລ້ວ.
hooks.desc = ເພີ່ມ webhooks ເຊິ່ງຈະເຮັດວຽກໃຫ້ກັບ <strong>ທຸກຄັງເກັບມ້ຽນ</strong> ທີ່ທ່ານເປັນເຈົ້າຂອງ.
orgs_none = ທ່ານບໍ່ໄດ້ເປັນສະມາຊິກຂອງອົງກອນໃດໆ.
repos_none = ທ່ານບໍ່ໄດ້ເປັນເຈົ້າຂອງຄັງເກັບມ້ຽນໃດໆ.
blocked_users_none = ບໍ່ມີຜູ້ໃຊ້ທີ່ຖືກບລັອກ.
delete_account = ລຶບບັນຊີຂອງທ່ານ
delete_prompt = ການດຳເນີນການນີ້ຈະລຶບບັນຊີຂອງທ່ານຢ່າງຖາວອນ. ມັນ <strong>ບໍ່ສາມາດ</strong> ກັບຄືນມາໄດ້.
delete_with_all_comments = ບັນຊີຂອງທ່ານມີອາຍຸນ້ອຍກວ່າ %s. ເພື່ອປ້ອງກັນບໍ່ໃຫ້ມີຄວາມຄິດເຫັນທີ່ບໍ່ມີເຈົ້າຂອງ, ຄວາມຄິດເຫັນທັງໝົດຂອງທ່ານໃນ issue/PR ຈະຖືກລຶບໄປພ້ອມກັນ.
confirm_delete_account = ຢືນຢັນການລຶບ
delete_account_title = ລຶບບັນຊີຜູ້ໃຊ້
delete_account_desc = ທ່ານແນ່ໃຈຫຼືບໍ່ວ່າຕ້ອງການລຶບບັນຊີຜູ້ໃຊ້ນີ້ຢ່າງຖາວອນ?
email_notifications.enable = ເປີດການແຈ້ງເຕືອນທາງອີເມລ
email_notifications.onmention = ແຈ້ງເຕືອນທາງອີເມລສະເພາະເມື່ອຖືກກ່າວເຖິງ (mention)
email_notifications.disable = ປິດການແຈ້ງເຕືອນທາງອີເມລ
email_notifications.submit = ຕັ້ງຄ່າການຮັບອີເມລ
email_notifications.andyourown = ແລະ ແຈ້ງເຕືອນກິດຈະກຳຂອງຕົນເອງນຳ
blocked_since = ຖືກບລັອກຕັ້ງແຕ່ %s
user_unblock_success = ປົດບລັອກຜູ້ໃຊ້ສຳເລັດແລ້ວ.
user_block_success = ບລັອກຜູ້ໃຊ້ສຳເລັດແລ້ວ.
user_block_yourself = ທ່ານບໍ່ສາມາດບລັອກຕົນເອງໄດ້.
quota.applies_to_user = ກົດລະບຽບໂຄຕ້າຕໍ່ໄປນີ້ມີຜົນບັງຄັບໃຊ້ກັບບັນຊີຂອງທ່ານ
quota.applies_to_org = ກົດລະບຽບໂຄຕ້າຕໍ່ໄປນີ້ມີຜົນບັງຄັບໃຊ້ກັບອົງກອນນີ້
quota.rule.exceeded = ເກີນກຳນົດ
quota.rule.exceeded.helper = ຂະໜາດລວມຂອງຂໍ້ມູນສຳລັບກົດລະບຽບນີ້ເກີນໂຄຕ້າທີ່ກຳນົດໄວ້.
quota.rule.no_limit = ບໍ່ຈຳກັດ

[repo]
rss.must_be_on_branch = ທ່ານຕ້ອງຢູ່ໃນສາຂາ (branch) ເພື່ອມີ RSS feed.
admin.manage_flags = ຈັດການທຸງ (Flags)
