settings.trust_model.collaborator = ຜູ້ຮ່ວມງານ
settings.trust_model.collaborator.long = ຜູ້ຮ່ວມງານ: ເຊື່ອຖືລາຍເຊັນໂດຍຜູ້ຮ່ວມງານ
settings.trust_model.collaborator.desc = ລາຍເຊັນທີ່ຖືກຕ້ອງໂດຍຜູ້ຮ່ວມງານຂອງຄັງເກັບນີ້ຈະຖືກໝາຍວ່າ "ເຊື່ອຖືໄດ້" (ບໍ່ວ່າຈະກົງກັບຜູ້ຄອມມິດຫຼືບໍ່). ຖ້າບໍ່ດັ່ງນັ້ນ, ລາຍເຊັນທີ່ຖືກຕ້ອງຈະຖືກໝາຍວ່າ "ບໍ່ໜ້າເຊື່ອຖື" ຫາກລາຍເຊັນກົງກັບຜູ້ຄອມມິດ ແລະ "ບໍ່ກົງກັນ" ຫາກບໍ່ກົງ.
settings.trust_model.committer = ຜູ້ຄອມມິດ
